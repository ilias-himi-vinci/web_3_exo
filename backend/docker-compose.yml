
services:
  db:
    image: postgres:17
    container_name: expenso-db
    restart: always
    environment:
      POSTGRES_USER: expenso
      POSTGRES_PASSWORD: expenso_password
      POSTGRES_DB: expenso
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
